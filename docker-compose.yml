version: '3.8'

services:
  area-evolution-api:
    image: atendai/evolution-api:v2.2.2
    container_name: area_evolution_api
    restart: always
    ports:
      - "8085:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://187.77.254.212:8085
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE,OPTIONS
      - CORS_CREDENTIALS=true

      # Chave de segurança exclusiva para a AREA Material Elétrico
      - AUTHENTICATION_API_KEY=AreaEletricaSecKey2026!

      # Persistência das sessões do WhatsApp em volume local
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=local
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true

      # Detalhes da sessão Baileys
      - CONFIG_SESSION_PHONE_CLIENT=AREA Material Eletrico
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - QRCODE_LIMIT=30
    volumes:
      - area_evolution_data:/evolution/instances

volumes:
  area_evolution_data:
